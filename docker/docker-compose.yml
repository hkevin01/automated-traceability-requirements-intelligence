services:
  atri-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: atri
      POSTGRES_PASSWORD: atri
      POSTGRES_DB: atri
    ports:
      - "5432:5432"
    volumes:
      - atri-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  atri-postgres:
