services:
  atri-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - neo4j

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: atri
      POSTGRES_PASSWORD: atri
      POSTGRES_DB: atri
    ports:
      - "5432:5432"
    volumes:
      - atri-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/atri-neo4j-secret
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - atri-neo4j:/data
      - atri-neo4j-logs:/logs

volumes:
  atri-postgres:
  atri-neo4j:
  atri-neo4j-logs:
